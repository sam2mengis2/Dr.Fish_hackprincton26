# CareLoop config. OpenHospital runs read the same file, so one edit = one experiment.

# --- LLM -------------------------------------------------------------------
# provider: mock  -> deterministic rule-based stand-ins, no API key needed
# provider: anthropic | openai | any provider supported by langchain's init_chat_model
llm:
  provider: anthropic
  # reasoner_backend: auto      -> mock rules (provider: mock) or one structured LLM call
  # reasoner_backend: deepagent -> LangChain Deep Agent "Diagnostic Investigator" (needs a real provider)
  reasoner_backend: deepagent
  extractor_model: claude-sonnet-5-5        # used when provider != mock
  reasoner_model: claude-sonnet-5-5
  verifier_model: claude-haiku-5-5          # ideally a DIFFERENT model than the reasoner
  comms_model: claude-haiku-5-5
  temperature: null          # newer Claude models don't accept a custom temperature

# --- Computer vision ---------------------------------------------------------
cv:
  cxr_backend: torchxrayvision          # mock | torchxrayvision
  cxr_weights: densenet121-res224-all
  # Per-finding thresholds; tune on a validation set (OpenHospital prints sensitivity per finding).
  cxr_thresholds:
    Pneumothorax: 0.55
    Mass: 0.6
    Nodule: 0.6
    Effusion: 0.6
    Consolidation: 0.6
    Cardiomegaly: 0.6
    default: 0.6
  brain_mri_backend: mock    # mock only: no open-source brain MRI model wired yet

# --- Pipeline ----------------------------------------------------------------
pipeline:
  verifier_enabled: true
  max_reasoner_retries: 2
  max_deep_agent_retries: 1     # a Deep Agent redo takes minutes; repeated critic complaints become reviewer notes
  confidence_floor: 0.5      # findings below this can't carry a diagnosis alone
  deep_agent_recursion_limit: 60

# --- Comms / timers (simulated clock) ------------------------------------------
timers:
  urgent_reminder_min: 15
  urgent_escalate_min: 30
  routine_reminder_min: 120
  routine_escalate_min: 240
  appt_reminder_days_before: [3, 1]
  rebook_escalate_hours: 24
  # Radiologist report turnaround targets by reading-queue priority (overdue alert, then 2nd notice at 2x)
  report_due_hours: {stat: 1, urgent: 24, routine: 72}

# --- Scheduling (multi-hospital) ---------------------------------------------
scheduling:
  # Days until each site's next free CT/MRI slot. Empty = no backlog (tests/evals).
  # The dashboard's "Simulate morning" turns on the demo backlog from data/demo_cases.json.
  backlog_days: {}
  offer_hours: 4          # how long an earlier-slot offer is held before going to the next patient
  min_lead_hours: 24      # don't offer freed slots sooner than this (too short notice to fill by text)

messenger: photon           # console | photon  (photon needs PHOTON_API_KEY, PHOTON_PROJECT_ID,
                             #  PHOTON_AGENT_HANDLE env vars; see careloop/photon_messenger.py)

store_dir: runs/cases
clock_start: "2026-11-14T09:00"
